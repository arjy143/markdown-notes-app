name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  QT_VERSION: '6.8.*'

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-format clang-tidy libxkbcommon-dev libgl1-mesa-dev
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Check formatting
        run: |
          find src tests bench -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror
      - name: Configure (warnings as errors)
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci
      - name: clang-tidy
        run: |
          find src -name '*.cpp' | xargs clang-tidy -p build/ci --quiet --warnings-as-errors='*'

  linux-asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libxkbcommon-dev libgl1-mesa-dev
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - name: Configure (warnings as errors)
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci

  package-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-asan]
    runs-on: ubuntu-22.04  # older glibc: the AppImage runs on more systems
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libxkbcommon-dev libgl1-mesa-dev libfuse2
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwaylandcompositor
          cache: true
      - run: packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: build/appimage/*.AppImage

  package-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - run: pwsh packaging/windows/build-zip.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: build/windows/*.zip
